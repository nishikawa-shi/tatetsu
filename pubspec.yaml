name: tatetsu
description: A new Flutter application.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0

environment:
  sdk: ">=3.10.1 <4.0.0"

dependencies:
  collection: ^1.16.0
  cupertino_icons: ^1.0.5
  english_words: ^4.0.0
  firebase_analytics: ^12.1.0
  firebase_core: ^4.3.0
  firebase_crashlytics: ^5.0.6
  flutter:
    sdk: flutter
  flutter_flavor: ^3.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^17.0.1
  google_mobile_ads: ^9.0.0
  intl: ^0.20.2
  japanese_family_name_generator: ^0.0.1
  json_annotation: ^4.7.0
  share_plus: ^12.0.1

dev_dependencies:
  build_runner: ^2.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_test:
    sdk: flutter
  json_serializable: ^6.5.4
  lint:
  test:

flutter:
  uses-material-design: true
  generate: true
  # SPM を明示的に有効化し、ローカル/CI とも Firebase SDK の解決方法を SPM に固定する。
  # まっさらな CI VM と手元環境で解決経路が食い違い、CI 限定のビルド失敗を生むのを防ぐ。
  config:
    enable-swift-package-manager: true

flutter_icons:
  android: true
  ios: true
